name: i18n module-scope t() check

# Catches the recurring bug: a top-level `const X = { label: t('...') }`
# at module scope crashes the minified bundle with
# "ReferenceError: t is not defined". `t` exists only inside the
# useTranslation() hook context.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-module-scope-t:
    name: scan src/**/*.tsx for bare module-scope t()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Run i18n module-scope check
        working-directory: shuttlescope
        run: python scripts/check_module_scope_t.py
