name: Trivy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs:
    name: trivy filesystem (IaC + config + deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          # IaC + secrets + misconfig もカバー
          scanners: vuln,misconfig,secret
        env:
          TRIVY_SKIP_DIRS: node_modules,.venv,out,dist,private_docs,backend/data
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@7fd177fa680c9881b53cdab4d346d32574c9f7f4 # v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
