name: TrackNet Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0'

concurrency:
  group: tracknet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tracknet-smoke:
    name: TrackNet export and load smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: shuttlescope

    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # TensorFlow 2.15.1 publishes wheels through Python 3.11, not 3.12.
          # Keep this job on 3.11 while the exporter depends on Keras 2 checkpoint loading.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            shuttlescope/backend/tracknet/requirements-smoke.txt
            shuttlescope/backend/tracknet/requirements-smoke.lock.txt

      - name: Install TrackNet dependencies
        # The human-maintained manifest pins the direct TrackNet toolchain.
        # CI executes the generated Linux/Python 3.11 lock below with
        # --require-hashes so every resolved transitive distribution is pinned
        # and integrity-checked as well.
        # TF 2.15 (Keras 2) is the last release that loads the V1/V2
        # checkpoint format produced by Chang-Chia-Chi/TrackNet via
        # model.load_weights("weights/TrackNet"). Keras 3 (TF >= 2.16)
        # only accepts .keras / .weights.h5 / .h5 files.
        # onnxruntime is required by the Smoke-load step to load the exported
        # tracknet.onnx. Not in backend/requirements.txt because production
        # may use OpenVINO instead.
        # ONNX 1.19+ imports ml_dtypes symbols unavailable in TF 2.15's
        # required ml-dtypes~=0.3.1. 1.18 is the newest converter-compatible
        # release without that dependency; TrackNet only consumes the ONNX file
        # generated in this job (no hub/external-data/version-converter inputs).
        run: |
          # Install the Linux/Python 3.11 lock with hashes for every resolved
          # wheel/sdist. This is the executable dependency source for CI.
          python -m pip install --require-hashes --requirement backend/tracknet/requirements-smoke.lock.txt
          python -m pip check

      - name: Verify TrackNet toolchain
        run: |
          python - <<'PY'
          import importlib.metadata as md
          expected = {
              "tensorflow": "2.15.1",
              "tf2onnx": "1.17.0",
              "protobuf": "4.25.8",
              "onnx": "1.18.0",
          }
          actual = {name: md.version(name) for name in expected}
          assert actual == expected, (actual, expected)
          print("TrackNet toolchain:", actual)
          PY

      - name: Download TensorFlow weights
        run: python -m backend.tracknet.setup download

      - name: Export ONNX from TensorFlow checkpoint
        run: python -m backend.tracknet.setup export

      - name: Download pinned upstream TrackNet functional vector
        run: |
          test_url="https://raw.githubusercontent.com/Chang-Chia-Chi/TrackNet-Badminton-Tracking-tensorflow2/d13eb075c7efcca25ede62ac4a21e18891c2f49b/test/test.mp4"
          test_file="${RUNNER_TEMP}/tracknet-upstream-test.mp4"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "$test_url" -o "$test_file"
          echo "b9ced4188f67f2b12068c74c96b7e3efdde2f1740bce7705b3956782e68943ce  $test_file" | sha256sum --check

      - name: Validate checkpoint and ONNX on known-positive frames
        run: |
          python -m backend.tracknet.functional_smoke \
            --video "${RUNNER_TEMP}/tracknet-upstream-test.mp4"

      - name: Smoke-load ONNX and auto backend
        run: |
          python - <<'PY'
          from backend.tracknet.inference import get_inference

          onnx_inf = get_inference("onnx_cpu")
          assert onnx_inf.is_available(), "onnx_cpu backend is not available"
          assert onnx_inf.load(), "onnx_cpu backend failed to load"

          auto_inf = get_inference("auto")
          assert auto_inf.is_available(), "auto backend is not available"
          assert auto_inf.load(), "auto backend failed to load"

          print("TrackNet smoke passed:", onnx_inf.backend_name(), auto_inf.backend_name())
          PY

      - name: Upload TrackNet export artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tracknet-export-artifacts
          path: |
            shuttlescope/backend/tracknet/weights/*.onnx
            shuttlescope/backend/tracknet/weights/*.index
            shuttlescope/backend/tracknet/weights/*.data-00000-of-00001
          if-no-files-found: warn
