name: pip-audit
on:
  push:
    branches: [main]
    paths:
      - "shuttlescope/backend/requirements.txt"
      - "shuttlescope/requirements_worker.txt"
      - ".github/workflows/pip-audit.yml"
  pull_request:
    paths:
      - "shuttlescope/backend/requirements.txt"
      - "shuttlescope/requirements_worker.txt"
  schedule:
    - cron: "0 5 * * 1"  # weekly Monday 05:00 UTC

permissions:
  contents: read

jobs:
  pip-audit-backend:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: shuttlescope/backend/requirements.txt
          # 既知の vuln 修正はバージョン昇格を要求する。CI 即落ち防止のため
          # 致命だけ failure、それ以外は warning にしたければ ignore-vulns で個別指定。

  pip-audit-worker:
    name: pip-audit (worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: shuttlescope/requirements_worker.txt
