name: Semgrep
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly Monday 03:00 UTC

# 最小権限: top-level は空、job 単位で必要な分のみ宣言。
permissions: {}

jobs:
  semgrep:
    name: semgrep scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Run Semgrep
        run: |
          semgrep ci \
            --config=p/default \
            --config=p/python \
            --config=p/react \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/owasp-top-ten \
            --sarif --output=semgrep.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@7fd177fa680c9881b53cdab4d346d32574c9f7f4 # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
