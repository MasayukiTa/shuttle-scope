version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/shuttlescope/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    commit-message:
      prefix: "deps(py)"
    labels: ["dependencies", "python"]

  - package-ecosystem: "pip"
    directory: "/shuttlescope"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      worker-deps:
        patterns: ["*"]
    commit-message:
      prefix: "deps(py-worker)"
    labels: ["dependencies", "python"]

  - package-ecosystem: "npm"
    directory: "/shuttlescope"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      js-deps:
        patterns: ["*"]
    commit-message:
      prefix: "deps(js)"
    labels: ["dependencies", "javascript"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
    labels: ["dependencies", "github-actions"]
