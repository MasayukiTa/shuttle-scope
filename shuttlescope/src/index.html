<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- iOS Safari の input/select フォーカス時の自動ズームを抑止する。
         maximum-scale=1.0 + user-scalable=no が iOS 拡大防止のために必要。
         アプリは Electron / モバイル Web 両対応で、モバイル時のみ意味を持つ。 -->
    <!-- viewport-fit=cover: iOS のノッチ / ホームインジケータ領域を扱えるよう拡張 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS Safari でホーム画面追加時に standalone モード (URL/タブバー無し)。
         /m/annotate のフルスクリーン的 UX に効く。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShuttleScope" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>ShuttleScope</title>
    <meta name="description" content="バドミントン試合映像の注釈・分析デスクトップアプリ" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShuttleScope" />
    <meta property="og:description" content="バドミントン試合映像の注釈・分析デスクトップアプリ" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShuttleScope" />
    <meta name="twitter:description" content="バドミントン試合映像の注釈・分析デスクトップアプリ" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- 白画面診断: bundle 評価より前に error / unhandledrejection を捕捉して
         画面最上部に banner で表示する。React の ErrorBoundary が捕捉できない
         module-level throw (ESM import 時の sync エラー) もここで確実に拾う。
         PWA / iOS Safari で Web Inspector が無いユーザのための唯一の診断手段。 -->
    <script>
      (function () {
        var show = function (label, msg) {
          try {
            var bar = document.getElementById('__ss_error_bar__');
            if (!bar) {
              bar = document.createElement('div');
              bar.id = '__ss_error_bar__';
              bar.style.cssText =
                'position:fixed;top:0;left:0;right:0;z-index:99999;' +
                'padding:10px 14px;font:12px/1.4 -apple-system,sans-serif;' +
                'background:#7f1d1d;color:#fff;white-space:pre-wrap;' +
                'word-break:break-all;max-height:60vh;overflow:auto;' +
                'border-bottom:2px solid #f87171';
              (document.body || document.documentElement).appendChild(bar);
            }
            var t = new Date().toISOString().slice(11, 19);
            bar.textContent = '[' + t + '] ' + label + ': ' + msg + '\n' + (bar.textContent || '');
          } catch (_e) { /* DOM 未準備時は無視 */ }
        };
        window.addEventListener('error', function (e) {
          var src = e.error && (e.error.stack || e.error.message);
          var msg = src || e.message || String(e);
          show('Error', msg + '\n  at ' + (e.filename || '?') + ':' + e.lineno + ':' + e.colno);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          var msg = (r && (r.stack || r.message)) || String(r);
          show('PromiseRejection', msg);
        });
      })();
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
