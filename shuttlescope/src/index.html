<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- iOS Safari の input/select フォーカス時の自動ズームを抑止する。
         maximum-scale=1.0 + user-scalable=no が iOS 拡大防止のために必要。
         アプリは Electron / モバイル Web 両対応で、モバイル時のみ意味を持つ。 -->
    <!-- viewport-fit=cover: iOS のノッチ / ホームインジケータ領域を扱えるよう拡張 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iOS Safari でホーム画面追加時に standalone モード (URL/タブバー無し)。
         /m/annotate のフルスクリーン的 UX に効く。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShuttleScope" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>ShuttleScope</title>
    <meta name="description" content="バドミントン試合映像の注釈・分析デスクトップアプリ" />
    <!-- favicon: Google 検索などは /favicon.ico を真の ICO で要求するため
         multi-size ICO + 各サイズ PNG を提供。order は spec の優先度に従う。 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShuttleScope" />
    <meta property="og:description" content="バドミントン試合映像の注釈・分析デスクトップアプリ" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShuttleScope" />
    <meta name="twitter:description" content="バドミントン試合映像の注釈・分析デスクトップアプリ" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- 白画面診断: bundle 評価より前に error / unhandledrejection を捕捉する。
         CSP `script-src 'self'` のため inline <script> は不可。外部ファイルで配信。-->
    <script src="/error-reporter.js"></script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
