
# ShuttleScope reverse proxy + observability frontend.
# Included from nginx.conf inside the http {} block.
# Sits in front of FastAPI on 127.0.0.1:8765. Listens on 8080 so the chocolatey
# default :80 server is preserved during cutover. Cloudflare Tunnel ingress
# will later be flipped from :8765 to :8080.

# ─── Real client IP from Cloudflare ────────────────────────────────────
# CF tunnel sets CF-Connecting-IP. We trust 127.0.0.1 (cloudflared is local).
set_real_ip_from 127.0.0.1;
real_ip_header   CF-Connecting-IP;
real_ip_recursive on;

# ─── Log formats ───────────────────────────────────────────────────────
log_format ss_main escape=json
    '{"ts":"$time_iso8601","remote":"$remote_addr","cf":"$http_cf_connecting_ip",'
    '"xff":"$http_x_forwarded_for","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
    '"ua":"$http_user_agent","ref":"$http_referer","ray":"$http_cf_ray",'
    '"country":"$http_cf_ipcountry","host":"$host"}';

# ─── Rate limit zones (per real client IP) ─────────────────────────────
# Login bursts: 10 req / 60s / IP
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
# General API: 600 req / min / IP (= 10 rps, generous)
limit_req_zone $binary_remote_addr zone=api_zone:50m rate=10r/s;

# ─── Connection limit ──────────────────────────────────────────────────
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# ─── ShuttleScope server ───────────────────────────────────────────────
server {
    listen       8080;
    server_name  _;

    access_log  logs/ss_access.log  ss_main buffer=64k flush=5s;
    error_log   logs/ss_error.log   warn;

    # Upload size: video files up to 4 GiB (FastAPI also enforces caps)
    client_max_body_size 4096m;
    # Long timeouts for streaming uploads / SSE / heavy analysis
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    proxy_connect_timeout 10s;

    # Default per-IP connection cap (covers everything)
    limit_conn conn_zone 50;

    # ─── Health endpoint: bypass logs to keep them readable ─────────
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
    }

    # ─── Login: tight rate limit ────────────────────────────────────
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-Ray            $http_cf_ray;
    }

    # ─── Block obvious probe paths early (defence-in-depth) ─────────
    # Backend ProbeDetectionMiddleware also handles these, but blocking at
    # nginx avoids burning Python for known-bad requests.
    location ~* ^/(\.env|\.git/|\.svn/|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|administrator|server-status|server-info|_ignition|actuator|owa/|ews/)(/|$) {
        access_log logs/ss_probe.log ss_main;
        return 404;
    }

    # ─── WebSocket support (live score / camera stream) ─────────────
    location ~ ^/(ws/|api/ws/) {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── Default: proxy everything else to FastAPI ──────────────────
    location / {
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-Ray            $http_cf_ray;
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;
    }
}
